<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Walden CRM</title><link rel="icon" href="favicon-blue.ico">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2FC;--card:#fff;--ink:#0B1D42;--mut:#52617F;--navy:#0F2A55;--sky:#4C7DFF;--sun:#FFC233;--line:#CBD6EE;--ok:#1E9E6A;--bad:#D9534F;--fd:'Bricolage Grotesque',Georgia,serif;--fb:'Figtree',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#06112A;--card:#0C1E44;--ink:#EAF0FF;--mut:#9DB0D8;--navy:#8FB0FF;--line:#1B3266}}
:root[data-theme=dark]{--bg:#06112A;--card:#0C1E44;--ink:#EAF0FF;--mut:#9DB0D8;--navy:#8FB0FF;--line:#1B3266}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--fb)}
h1,h2,h3{font-family:var(--fd);font-weight:800;letter-spacing:-.01em}h1{font-size:1.7rem}h3{font-size:1.05rem}
[hidden]{display:none!important}button,input,select,textarea{font:inherit;color:inherit}code{word-break:break-all}
.dk,.lt{height:34px;width:auto}.dk{display:none}@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .lt{display:none}:root:not([data-theme=light]) .dk{display:block}}
:root[data-theme=dark] .lt{display:none}:root[data-theme=dark] .dk{display:block}:root[data-theme=light] .dk{display:none}:root[data-theme=light] .lt{display:block}
.btn{padding:9px 16px;border-radius:99px;border:0;background:var(--sun);color:#0B1D42;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}.btn.g{background:transparent;border:1.5px solid var(--line);color:var(--ink)}.btn.d{background:var(--bad);color:#fff}.btn.s{padding:5px 11px;font-size:.82rem}.btn:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lc{background:var(--card);border:1px solid var(--line);border-radius:28px 6px 28px 6px;padding:36px 30px;max-width:420px;width:100%;text-align:center}.lc img{height:60px;margin-bottom:10px}.lc>p{color:var(--mut);margin:8px 0 14px}.lc form{text-align:left}#le{color:var(--bad);margin-top:14px;min-height:1.4em;text-align:center}
.pr{display:flex;gap:6px;align-items:center}
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside .br{display:flex;align-items:center;gap:10px;font:800 1.1rem var(--fd);padding:4px 8px 14px}
aside h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 8px 4px}
aside a{display:block;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;cursor:pointer}aside a:hover{background:var(--bg)}aside a.on{background:var(--navy);color:var(--bg)}
main{padding:24px clamp(14px,3vw,36px) 60px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}.top>div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.k{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}.k b{display:block;font:800 1.5rem var(--fd)}.k span{color:var(--mut);font-size:.85rem}
.cd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.cd p{margin-top:6px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}th{font-size:.78rem;text-transform:uppercase;color:var(--mut)}tr.r{cursor:pointer}tr.r:hover td{background:var(--bg)}
.pl{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px}.col{flex:0 0 230px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.col h3{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:8px}
.cr{background:var(--bg);border-radius:12px;padding:10px;margin-bottom:8px;font-size:.88rem}.cr b{cursor:pointer;display:block}.cr div{display:flex;justify-content:space-between;margin-top:6px;color:var(--mut)}
.ib{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:14px}@media(max-width:900px){.ib{grid-template-columns:1fr}}
.mi{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}.mi.on{border-color:var(--sky)}.mi.n b:before{content:"● ";color:var(--sky)}.mi small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0}.bar i{display:block;height:12px;border-radius:6px;background:var(--sky);min-width:3px}.bar span{width:120px;font-size:.85rem;color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);padding:24px;width:min(560px,94vw);max-height:92vh}dialog::backdrop{background:rgba(6,17,42,.6)}
label{display:block;font-weight:600;font-size:.85rem;margin-top:12px}input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);margin-top:4px}
.ar{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}.tag{padding:2px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:.78rem}
#bm{display:none}.tl{position:fixed;top:14px;right:14px}
@media(max-width:900px){#app{grid-template-columns:1fr}aside{position:fixed;z-index:30;left:0;width:260px;transform:translateX(-100%);transition:transform .25s}aside.o{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}#bm{display:inline-block}}
</style></head><body>
<div id="login"><button class="btn g s thb tl" type="button" aria-label="Changer de thème">◐</button>
<div class="lc"><img class="lt" src="Icon_Only_Blue-removebg.png" alt="Walden Corp"><img class="dk" src="logo_only_bleu_beige.png" alt="Walden Corp"><h1>Walden CRM</h1><p>Espace privé réservé au propriétaire.</p>
<form id="f1"><label>Adresse e-mail<input id="em" type="email" autocomplete="username" required></label>
<label>Mot de passe<span class="pr"><input id="pw" type="password" autocomplete="current-password" required><button type="button" class="btn g s" id="pt" aria-label="Afficher ou masquer le mot de passe">👁</button></span></label>
<button class="btn" style="width:100%;margin-top:18px">Se connecter</button></form>
<form id="f2" hidden><label>Code de vérification (application d'authentification)<input id="tp" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label><button class="btn" style="width:100%;margin-top:18px">Vérifier</button></form>
<div id="le" role="alert"></div></div></div>
<div id="app" hidden>
<aside id="sd"><div class="br"><img class="lt" src="Icon_Only_Blue-removebg.png" alt=""><img class="dk" src="logo_only_bleu_beige.png" alt="">Walden CRM</div><nav id="nv"></nav></aside>
<main><div class="top"><div><button class="btn g s" id="bm" aria-label="Menu">☰</button><h1 id="tt"></h1></div><div><button class="btn g s thb" aria-label="Changer de thème">◐</button><button class="btn g s" id="so">Déconnexion</button></div></div><div id="vw"></div></main></div>
<dialog id="dg"><form id="fm" method="dialog"></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body></html>
